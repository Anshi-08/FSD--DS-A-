<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operators</title>
</head>
<body>
    <script>
         let a=12;
         let b=30;
         let c=a+b;
         document.write(c);
         let d=b-a;
         document.write(d);
         let e=a*b;
         document.write(e);
         let f=b/a;
         document.write(f);
    </script>
</body>
</html>
