<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const num=[11,22,32,23,6,45];
        const even=num.filter((i)=>(i%2==0));
        <!--map creates an array from original array by the elements from array according to the condition-->

        const square=even.map((i)=>(i*i));
        console.log("square==",square);
    </script>
</body>
</html>
