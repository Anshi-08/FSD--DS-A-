        let a = prompt("Enter 1 for Car, 2 for Aeroplane, 3 for Helicopter:");
        
        if (a == 1) {
    const car = () => {
        let seats = prompt("Enter number of seats:"); 
        if (seats > 2) {
            return "Sorry! Only 2 seats are available.";
        }
        let cost = seats * 20;

        return "Car name: Fortuner<br>" + "Your seats: " + seats + "<br>" + "Total cost: " + cost + " hundred";
    };

    document.write(car());

} 
else if (a == 2) {
    const Aeroplane = () => {
        let seats = prompt("Enter number of seats:");
        if (seats > 6) {
            return "Sorry! Only 6 seats are available.";
        }
        let cost = seats * 10;
        return "Vehicle: Aeroplane<br>" + "Your seats: " + seats + "<br>" + "Total cost: " + cost + " lakhs";
    };
    document.write(Aeroplane());
} 
else if (a == 3) {
   const helicopter = () => {
        let seats = prompt("Enter number of seats:");
        if (seats > 10) {
            return "Sorry! Only 10 seats are available.";
        }
        let cost = seats * 50;
        return "Vehicle: Helicopter<br>" +
               "Your seats: " + seats + "<br>" +
               "Total cost: " + cost + " lakhs";
    };
    document.write(helicopter());
